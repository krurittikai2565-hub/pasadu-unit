/* Layout: แถบเมนูซ้ายสีหมึกราชการ + พื้นที่ทำงานกระดาษ; สถานะพัสดุแสดงเป็น "ตรายาง" */
:root{
  --ink:#1d3557; --ink-2:#2b4a75; --paper:#f4f6f8; --card:#ffffff; --line:#d9dfe6; --fg:#1b2430; --muted:#5d6b7c;
  --stamp:#b42318; --ok:#1f7a4d; --warn:#a15c07; --bad:#b42318; --gray:#6b7280; --hi:#e8eef7; --sel:#dbe6f5;
  --f-ui:"IBM Plex Sans Thai","Sarabun","Leelawadee UI","Tahoma",sans-serif;
  --f-doc:"Sarabun","TH Sarabun New","Leelawadee UI","Tahoma",serif;
  --f-num:"IBM Plex Mono","Consolas",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#0f1c2e; --ink-2:#1b2c45; --paper:#121821; --card:#1a222d; --line:#2c3746; --fg:#e4e9f0; --muted:#97a3b3;
  --stamp:#f0776c; --ok:#4cc38a; --warn:#e3a33c; --bad:#f0776c; --gray:#9aa3b0; --hi:#212c3a; --sel:#26364c; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#0f1c2e; --ink-2:#1b2c45; --paper:#121821; --card:#1a222d; --line:#2c3746; --fg:#e4e9f0; --muted:#97a3b3;
  --stamp:#f0776c; --ok:#4cc38a; --warn:#e3a33c; --bad:#f0776c; --gray:#9aa3b0; --hi:#212c3a; --sel:#26364c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--fg);font:15px/1.6 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
nav.side{background:var(--ink);color:#e9eef6;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.brand .seal{width:38px;height:38px;border-radius:50%;border:2px solid #f1c27d;display:grid;place-items:center;font-weight:700;color:#f1c27d;flex:none}
.brand b{display:block;font-size:15px;line-height:1.3}
.brand small{display:block;font-size:12px;opacity:.75;line-height:1.3}
.navgrp{font-size:11.5px;letter-spacing:.06em;opacity:.6;padding:12px 10px 4px}
nav.side a{display:block;padding:7px 10px;border-radius:6px;color:inherit;text-decoration:none;font-size:14.5px}
nav.side a:hover{background:rgba(255,255,255,.08)}
nav.side a.on{background:#f1c27d;color:#1d3557;font-weight:600}
main{min-width:0;padding-block:20px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:23px;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hi)}
.btn.pri{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #f1c27d;outline-offset:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi .n{font:600 24px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{background:var(--hi);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--hi)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.code{font-family:var(--f-num);font-size:13px;white-space:nowrap}
.stamp{display:inline-block;border:1.5px solid currentColor;border-radius:4px;padding:0 6px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;transform:rotate(-1.5deg)}
.s-ok{color:var(--ok)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)} .s-gray{color:var(--gray)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);min-width:0}
.filters input[type=search]{flex:1 1 220px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.banner{background:color-mix(in srgb,#f1c27d 28%,var(--card));border:1px solid #e0b46c;border-radius:8px;padding:9px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--hi)}
.bar span{display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
/* forms */
dialog{border:none;border-radius:12px;padding:0;width:min(860px,96vw);max-height:92vh;background:var(--card);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,25,40,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.db{padding:16px 18px;overflow:auto}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card)}
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);grid-column:span 2;min-width:0}
.fg label.w3{grid-column:span 3}.fg label.w4{grid-column:span 4}.fg label.w6{grid-column:span 6}.fg label.w1{grid-column:span 1}
.fg input,.fg select,.fg textarea,.lines input,.lines select,.pick input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--fg);font-size:14.5px;width:100%;min-width:0}
.fg textarea{min-height:64px;resize:vertical}
.lines{width:100%;border-collapse:collapse;margin-top:6px}
.lines td,.lines th{padding:4px;text-align:left;font-size:13px;color:var(--muted);font-weight:500}
.pick{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.pick label{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.pick label:hover{background:var(--hi)}
.pick input[type=checkbox]{width:auto}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{border-color:var(--ink-2);color:var(--fg);font-weight:600}
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rep .panel{display:flex;flex-direction:column;gap:8px}
.rep .form-no{font:500 12px var(--f-num);color:var(--stamp)}
.rep .panel p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:50}
.toast.err{background:var(--bad)}
.filebadge{font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.12);display:inline-block;margin:10px 8px 0}
/* print preview */
#pv{position:fixed;inset:0;background:#5f6b78;z-index:40;overflow:auto;padding:0 0 40px}
#pv .pvbar{position:sticky;top:0;background:var(--ink);color:#fff;display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));z-index:2;flex-wrap:wrap}
#pv .pvbar .btn{background:#fff;color:#1d3557;border-color:#fff}
#paper{margin:20px auto;max-width:100%}
.sheet{background:#fff;color:#000;width:210mm;min-height:297mm;padding:16mm 15mm;margin:0 auto 14px;font:15px/1.45 var(--f-doc);box-shadow:0 4px 18px rgba(0,0,0,.3);overflow:hidden}
.sheet.land{width:297mm;min-height:210mm}
.sheet h3{text-align:center;font-size:20px;margin:0 0 4px}
.sheet .fno{text-align:right;font-size:13px}
.sheet table.f{border-collapse:collapse;width:100%;font-size:13.5px}
.sheet table.f th,.sheet table.f td{border:1px solid #000;padding:3px 5px;vertical-align:top}
.sheet table.f th{font-weight:600;text-align:center;background:#f2f2f2}
.sheet .r{text-align:right}.sheet .c{text-align:center}
.sheet .sig{display:grid;grid-template-columns:1fr 1fr;gap:26px 30px;margin-top:22px;text-align:center}
.sheet .sig div{line-height:1.7}
.sheet .memo-h{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 14px}
.sheet .memo-h b{font-weight:700}
.sheet p{margin:0 0 8px}
.sheet .ind{text-indent:2.5em}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;height:auto;z-index:20;display:flex;gap:4px;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-left,0px));white-space:nowrap}
  .brand,.navgrp,.filebadge{display:none}
  nav.side a{display:inline-block;flex:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .fg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fg label,.fg label.w3,.fg label.w4,.fg label.w6{grid-column:span 2}.fg label.w1{grid-column:span 1}
  .kv{grid-template-columns:1fr}
}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  .app,.toast,dialog,#pv .pvbar{display:none!important}
  #pv{position:static;background:#fff;padding:0;overflow:visible}
  #paper{margin:0}
  .sheet{box-shadow:none;margin:0;padding:0;width:auto;min-height:0;page-break-after:always}
  .sheet:last-child{page-break-after:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style id="pageStyle"></style>
</head>
<body>
<style>.sheet.p3101{position:relative;padding:0;width:210mm;height:297mm;min-height:0}.sheet.p3101 img{position:absolute;inset:0;width:100%;height:100%;max-width:none}@media print{.sheet.p3101{width:210mm!important;height:296.5mm!important;overflow:hidden}}</style>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="pv" hidden>
  <div class="pvbar">
    <button class="btn" data-act="pv-close" id="pvClose">← กลับ</button>
    <button class="btn" data-act="pv-print" id="pvPrint">พิมพ์</button>
    <button class="btn" data-act="pv-pdf" id="pvPdf">ดาวน์โหลด PDF</button>
    <button class="btn" data-act="pv-xls" id="pvXls">ส่งออก Excel</button>
    <a class="btn" id="pvLink" target="_blank" rel="noopener" hidden></a>
    <span id="pvTitle" style="opacity:.85"></span>
  </div>
  <div id="paper"></div>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ ค่าคงที่ ============ */
const KEY='pasadu-unit-v1';
const MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const CONDS=['ใช้การได้','ชำรุด','เสื่อมสภาพ','สูญไป','ไม่จำเป็นต้องใช้'];
const CONDCLS={'ใช้การได้':'s-ok','ชำรุด':'s-warn','เสื่อมสภาพ':'s-bad','สูญไป':'s-bad','ไม่จำเป็นต้องใช้':'s-gray','ส่งคืนแล้ว':'s-gray'};
const MKINDS=['วัสดุสิ้นเปลือง','วัสดุถาวร'];
const MGROUPS=['วัสดุฝึก','วัสดุสำนักงาน','วัสดุไฟฟ้าและวิทยุ','วัสดุคอมพิวเตอร์','วัสดุงานบ้านงานครัว','วัสดุก่อสร้าง','วัสดุเชื้อเพลิงและหล่อลื่น','วัสดุยานพาหนะและขนส่ง','วัสดุการเกษตร','วัสดุวิทยาศาสตร์','หนังสือเรียน','เครื่องมือประจำตัวผู้เรียน','อื่น ๆ'];
const PER_BOOK=50;
const FUNDS=['เงินงบประมาณ','เงินรายได้สถานศึกษา (บำรุงการศึกษา)','เงินอุดหนุน','เงินบริจาค','อื่น ๆ'];
const NEEDT=['ขั้นต้น','ทดแทน','ยืม'];

/* ============ ยูทิลิตี ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=(n,w)=>String(n).padStart(w,'0');
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const fm=(n,d=2)=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const fi=n=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)};
const nowISO=()=>new Date().toISOString();
const fyOf=iso=>{if(!iso)return 0;const y=+iso.slice(0,4),m=+iso.slice(5,7);return (m>=10?y+1:y)+543};
const fyEnd=fy=>(fy-543)+'-09-30';
const fyStart=fy=>(fy-544)+'-10-01';
const dS=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return (+d)+' '+MS[+m-1]+' '+(+y+543)};
const dL=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return (+d)+' '+MONTHS[+m-1]+' '+(+y+543)};
function T(s){s=String(s??'');return db&&db.settings.thaiNum?s.replace(/[0-9]/g,c=>'๐๑๒๓๔๕๖๗๘๙'[c]):s}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?4200:2400)}
function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function opts(list,sel,blank){return (blank!=null?`<option value="">${esc(blank)}</option>`:'')+list.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}"${String(v)===String(sel??'')?' selected':''}>${esc(l)}</option>`}).join('')}
function confirm2(btn,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed='1';const o=btn.textContent;btn.textContent='กดอีกครั้งเพื่อยืนยัน';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=o}},3500)}
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:((a.created||'')<(b.created||'')?-1:1);

/* ============ ฐานข้อมูล ============ */
let db;
function blank(){return{app:'pasadu-unit',version:1,sample:false,
  settings:{org:'วิทยาลัยการอาชีพเขาย้อย',unit:'',central:'งานพัสดุ (หน่วยจ่าย - พัสดุกลาง)',headName:'',headPos:'หัวหน้าแผนกวิชา',officerName:'',officerPos:'เจ้าหน้าที่พัสดุประจำแผนก',bookStart:1,thaiNum:true},
  rooms:[],items:[],assets:[],reqs:[],inner:[],repairs:[],condLogs:[],counts:[],counters:{}}}
function load(){try{const s=localStorage.getItem(KEY);if(s){db=Object.assign(blank(),JSON.parse(s));return}}catch(e){}seedSample()}
let saveTimer;
function save(){if(GAS){gasQueue();return}try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('บันทึกลงเบราว์เซอร์ไม่สำเร็จ: '+e.message,true)}clearTimeout(saveTimer);saveTimer=setTimeout(fileAutosave,800)}
/* ทะเบียนใบเบิก: วัสดุ 001-ปี, ครุภัณฑ์ 701-ปี (ตามคู่มือ สอศ.) */
function nextReg(cls,date){const fy=fyOf(date);const k=cls+'-'+fy;db.counters[k]=(db.counters[k]||0)+1;return pad((cls==='A'?700:0)+db.counters[k],3)+'-'+pad(fy%100,2)}
function nextInner(){db.counters.inner=(db.counters.inner||0)+1;const n=db.counters.inner-1;return{book:num(db.settings.bookStart||1)+Math.floor(n/PER_BOOK),no:n%PER_BOOK+1}}
const unitName=()=>db.settings.unit||'(ชื่อหน่วยเบิก)';
const itemOf=id=>db.items.find(x=>x.id===id);
const assetOf=id=>db.assets.find(x=>x.id===id);

/* ============ ไฟล์ข้อมูลบนดิสก์ (Google Drive) ============ */
let fileHandle=null,filePerm=false;
const fsOK='showSaveFilePicker' in window;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('pasadu-unit-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(v){try{const d=await idb();d.transaction('h','readwrite').objectStore('h').put(v,'file')}catch(e){}}
async function idbGet(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('h').objectStore('h').get('file');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function fileAutosave(){if(!fileHandle||!filePerm)return;try{const w=await fileHandle.createWritable();await w.write(JSON.stringify(db));await w.close()}catch(e){filePerm=false;renderNav()}}
async function linkFile(){try{fileHandle=await window.showSaveFilePicker({suggestedName:'ข้อมูลพัสดุหน่วยเบิก.json',types:[{description:'ข้อมูลพัสดุ',accept:{'application/json':['.json']}}]});filePerm=true;await idbSet(fileHandle);await fileAutosave();toast('เชื่อมไฟล์แล้ว ระบบจะบันทึกลงไฟล์ทุกครั้งที่แก้ไข');render()}catch(e){if(e.name!=='AbortError')toast(e.message,true)}}
async function regrant(){if(!fileHandle)return;try{filePerm=(await fileHandle.requestPermission({mode:'readwrite'}))==='granted';if(filePerm){const txt=await (await fileHandle.getFile()).text();if(txt.trim()){const d=JSON.parse(txt);if(d.app==='pasadu-unit'){db=Object.assign(blank(),d);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}}toast('เชื่อมไฟล์ '+fileHandle.name+' แล้ว')}render()}catch(e){toast(e.message,true)}}

/* ============ บัญชีคุมวัสดุ (พ.3104) ============ */
const reqStatus=r=>{if(r.kind==='ret')return 'ส่งคืนแล้ว';if(r.kind==='open')return 'ยอดยกมา';if(!r.recvDate)return 'รอรับ';if(r.closed)return 'ปิดแล้ว';
  const left=r.lines.some(l=>num(l.recv)<num(l.qty));return left?'ค้างรับ':'รับครบ'};
const STCLS={'รอรับ':'s-warn','ค้างรับ':'s-warn','รับครบ':'s-ok','ปิดแล้ว':'s-gray','ส่งคืนแล้ว':'s-gray','ยอดยกมา':'s-gray'};
const stChip=s=>`<span class="stamp ${STCLS[s]||'s-gray'}">${esc(s)}</span>`;
function outstanding(r,l){if(r.kind!=='req'||r.closed)return 0;return Math.max(0,num(l.qty)-(r.recvDate?num(l.recv):0))}
function mledger(reqs,inner){reqs=reqs||db.reqs;inner=inner||db.inner;const L={},errs=[];
  for(const it of db.items)L[it.id]={rows:[],qty:0,inQ:0,outQ:0,val:0,pend:0};
  const ev=[];
  for(const r of reqs){if(r.cls!=='M')continue;
    if(r.kind==='open')ev.push({date:r.date,created:r.created,r,type:'open'});
    if(r.kind==='req'){ev.push({date:r.date,created:r.created,r,type:'ask'});if(r.recvDate)ev.push({date:r.recvDate,created:r.created+'z',r,type:'in'})}
    if(r.kind==='ret')ev.push({date:r.date,created:r.created,r,type:'ret'})}
  for(const d of inner){if(d.kind==='issue'&&d.lines.some(l=>l.iid))ev.push({date:d.date,created:d.created,d,type:'inner'})}
  ev.sort(byDate);
  for(const e of ev){const lines=(e.r||e.d).lines;for(const l of lines){if(!l.iid)continue;const g=L[l.iid];if(!g)continue;
    if(e.type==='open'||e.type==='in'){const q=num(e.type==='in'?l.recv:l.qty);if(!q&&e.type==='in')continue;g.qty+=q;g.inQ+=q;g.val+=q*num(l.price);g.rows.push({e,l,in:q,bal:g.qty})}
    else if(e.type==='ask'){g.rows.push({e,l,ask:num(l.qty),bal:g.qty})}
    else{const q=num(l.qty);g.qty-=q;g.outQ+=q;g.rows.push({e,l,out:q,bal:g.qty});if(g.qty<-1e-9){const it=itemOf(l.iid);errs.push(`${it?.name} คงเหลือไม่พอ ณ ${dS(e.date)}`)}}}}
  for(const r of reqs){if(r.cls==='M'&&r.kind==='req')for(const l of r.lines){if(L[l.iid])L[l.iid].pend+=outstanding(r,l)}}
  return{L,errs}}

/* ============ ครุภัณฑ์ (พ.3103) ============ */
function aState(asOf,inner,reqs){inner=inner||db.inner;reqs=reqs||db.reqs;const st={},errs=[];
  for(const a of db.assets)st[a.id]={holder:null,cond:a.cond0||'ใช้การได้',gone:false,goneDate:null,ev:[]};
  const ev=[];
  for(const a of db.assets)ev.push({date:a.recvDate,created:'0'+(a.created||''),type:'recv',a});
  for(const d of inner){for(const l of d.lines)if(l.aid)ev.push({date:d.date,created:d.created,type:d.kind==='issue'?'assign':'back',d,aid:l.aid})}
  for(const r of reqs){if(r.kind==='ret'&&r.cls==='A')for(const l of r.lines)ev.push({date:r.date,created:r.created,type:'ret',r,aid:l.aid,cond:l.cond})}
  for(const p of db.repairs)ev.push({date:p.date,created:p.created,type:'repair',p,aid:p.aid});
  for(const c of db.condLogs)ev.push({date:c.date,created:c.created,type:'cond',c,aid:c.aid});
  ev.sort(byDate);
  for(const e of ev){if(asOf&&e.date>asOf)continue;const id=e.a?e.a.id:e.aid;const s=st[id];if(!s)continue;const a=assetOf(id);
    if(e.type!=='recv'&&s.gone){errs.push(`${a.code}: ส่งคืนงานพัสดุไปแล้ว`);continue}
    if(e.type!=='recv'&&e.date<a.recvDate){errs.push(`${a.code}: วันที่ก่อนวันรับเข้า`);continue}
    switch(e.type){case 'assign':s.holder=e.d.to;break;case 'back':s.holder=null;if(e.d.cond)s.cond=e.d.cond;break;
      case 'ret':s.gone=true;s.goneDate=e.date;s.holder=null;if(e.cond)s.cond=e.cond;break;
      case 'repair':s.cond=e.p.after||'ใช้การได้';break;case 'cond':s.cond=e.c.cond;break}
    s.ev.push(e)}
  return{st,errs}}
const aStatus=s=>s.gone?'ส่งคืนแล้ว':s.cond;

function p31Canvas(){const c=document.createElement('canvas');c.width=Math.round(P31.W*P31.S);c.height=Math.round(P31.H*P31.S);const ctx=c.getContext('2d');ctx.fillStyle='#000';ctx.strokeStyle='#000';ctx.textBaseline='alphabetic';
  const font=(size,bold)=>`${bold?700:400} ${size*P31.S}px PdfSarabun, "TH Sarabun New", "Leelawadee UI", Tahoma, sans-serif`;
  const width=(t,size,bold)=>{ctx.font=font(size,bold);return ctx.measureText(t).width/P31.S};
  /* วางข้อความ: x,y เป็นจุด (pt) วัดจากมุมบนซ้าย y คือเส้นฐาน */
  const text=(t,x,y,o={})=>{t=String(t??'');if(!t)return;let size=o.size||11;const bold=!!o.bold;
    if(o.maxW)while(size>6.5&&width(t,size,bold)>o.maxW)size-=.25;

function p31Lines(r){const isA=r.cls==='A',ret=r.kind==='ret',out=[];
  r.lines.forEach((l,i)=>{let o={no:i+1,code:'',name:'',rc:'',unit:'',qty:'',got:'',owe:'',price:null,total:null};
    if(isA&&ret){const a=assetOf(l.aid)||{};Object.assign(o,{code:a.code,name:a.name+(a.serial?' S/N '+a.serial:''),rc:l.cond?(l.cond==='ใช้การได้'?'ช.':'ชม.'):'',unit:a.unit,qty:1,price:num(a.price),total:num(a.price)})}
    else if(isA){Object.assign(o,{name:l.name,unit:l.unit,qty:l.qty});if(r.recvDate){o.got=l.recv;o.owe=Math.max(0,num(l.qty)-num(l.recv))||'';o.price=num(l.price);o.total=num(l.recv)*num(l.price);
      const codes=(l.assetIds||[]).map(x=>assetOf(x)?.code).filter(Boolean);if(codes.length===1)o.code=codes[0];else if(codes.length>1)o.extra=codes}}
    else{const it=itemOf(l.iid)||{};Object.assign(o,{code:it.code||'',name:it.name,unit:it.unit,qty:l.qty});
      if(ret){if(num(l.price)){o.price=num(l.price);o.total=num(l.qty)*o.price}}
      else if(r.recvDate){o.got=l.recv;o.owe=Math.max(0,num(l.qty)-num(l.recv))||'';o.price=num(l.price);o.total=num(l.recv)*num(l.price)}}
    out.push(o)});
  return out}

let pvBlobUrl=null,pvPdf=null,pvXlsFn=null;
/* ตั้งค่าแถบปุ่มหน้าตัวอย่าง: ทุกเอกสารมี พิมพ์ / ดาวน์โหลด PDF / ส่งออก Excel */
function pvReady(title,fileBase){$('#pvLink').hidden=true;$('#pvTitle').textContent=title;pvPdf={name:fileBase.replace(/[\\/:*?"<>|]/g,'')+'.pdf',blob:null};$('#pvPdf').hidden=false;$('#pvXls').hidden=false;$('#pv').hidden=false}

/* แปลงแผ่นรายงาน (.sheet) เป็น PDF: วาด HTML ลงภาพผ่าน SVG แล้วตัดหน้าตามขอบแถวตาราง */
function sheetCss(){let css='';for(const ss of document.styleSheets){let rules;try{rules=ss.cssRules}catch(e){continue}
    for(const r of rules){if(r.type===5&&/PdfSarabun/.test(r.cssText))css+=r.cssText+'\n';else if(r.selectorText&&/\.sheet/.test(r.selectorText))css+=r.cssText+'\n'}}
  return css+`.sheet{font-family:PdfSarabun,"TH Sarabun New",Tahoma,sans-serif!important;box-shadow:none!important;margin:0!important;min-height:0!important;background:#fff;color:#000}`}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('วาดหน้ารายงานไม่สำเร็จ'));i.src=src})}
async function sheetsToPdf(){try{await Promise.all([document.fonts.load('400 20px PdfSarabun','ก'),document.fonts.load('700 20px PdfSarabun','ก')])}catch(e){}
  const MM=96/25.4,SC=2.5,css=sheetCss(),out=await PDFLib.PDFDocument.create();out.setTitle($('#pvTitle').textContent);out.setCreator('ระบบพัสดุหน่วยเบิก');
  for(const sh of document.querySelectorAll('#paper .sheet')){const land=sh.classList.contains('land');const W=(land?297:210)*MM,H=(land?210:297)*MM,pad=16*MM;
    const top0=sh.getBoundingClientRect().top;const contentBottom=Math.max(0,...[...sh.children].map(e=>e.getBoundingClientRect().bottom-top0));const total=Math.ceil(Math.min(sh.getBoundingClientRect().height,contentBottom+pad));
    const cuts=[...new Set([...sh.querySelectorAll('tr,p,h3,.sig,.memo-h,.fno,table,br,div')].map(e=>Math.round(e.getBoundingClientRect().bottom-top0)))].filter(v=>v>0).sort((a,b)=>a-b);
    const clone=sh.cloneNode(true);clone.style.width=W+'px';clone.style.boxSizing='border-box';
    const xhtml=new XMLSerializer().serializeToString(clone);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(W*SC)}" height="${Math.ceil(total*SC)}"><foreignObject x="0" y="0" width="${W}" height="${total}" transform="scale(${SC})"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css.replace(/]]>/g,'')}</style>${xhtml}</div></foreignObject></svg>`;
    const img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
    const big=document.createElement('canvas');big.width=Math.ceil(W*SC);big.height=Math.ceil(total*SC);const g=big.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,big.width,big.height);g.drawImage(img,0,0);
    let start=0,first=true;
    while(start<total-2){const room=first?H-pad:H-2*pad;let cut=start+room;if(cut<total){const ok=cuts.filter(c=>c>start+40&&c<=start+room);if(ok.length)cut=ok[ok.length-1]}else cut=total;
      const hpx=Math.ceil((cut-start)*SC);const c=document.createElement('canvas');c.width=big.width;c.height=Math.max(1,hpx);c.getContext('2d').drawImage(big,0,Math.floor(start*SC),big.width,hpx,0,0,big.width,hpx);
      const png=await out.embedPng(c.toDataURL('image/png'));const pw=W*.75,ph=H*.75;const page=out.addPage([pw,ph]);const y0=first?0:pad;
      page.drawImage(png,{x:0,y:ph-(y0+(cut-start))*.75,width:pw,height:(cut-start)*.75});start=cut;first=false}}
  return new Blob([await out.save()],{type:'application/pdf'})}

/* ============ โหมด Google Sheet ============
   GAS_UI  = เปิดผ่านเว็บแอป Apps Script โดยตรง (google.script.run)
   API_MODE = เปิดจากเว็บอื่น เช่น GitHub Pages แล้วเรียก Apps Script ผ่าน doPost พร้อมรหัสผ่านของหน่วย */
const GAS_UI=!!(window.google&&google.script&&google.script.run);
const API_MODE=!GAS_UI&&!!window.PASADU_API;
const GAS=GAS_UI||API_MODE;
/* หลายฐานข้อมูล: แต่ละหน่วยเบิก (หัวหน้าหน่วยเบิกแต่ละคน) มี Google Sheet + รหัสผ่านของตัวเอง เก็บรายการไว้ในเบราว์เซอร์ */
const CONN_STORE='pasadu-conns';
let conns={list:[],current:'',auto:true};
try{const c=JSON.parse(localStorage.getItem(CONN_STORE)||'null');if(c&&Array.isArray(c.list))conns=Object.assign(conns,c);
  else{const old=JSON.parse(localStorage.getItem('pasadu-api')||'null');if(old&&old.url){const id='c'+Date.now().toString(36);conns.list=[{id,name:'',url:old.url,key:old.key}];conns.current=id}}}catch(e){}
const connSave=()=>{try{localStorage.setItem(CONN_STORE,JSON.stringify(conns))}catch(e){}};
const connCur=()=>conns.list.find(c=>c.id===conns.current)||null;
let api={url:'',key:''};
const GTITLE={items:'วัสดุ',assets:'ครุภัณฑ์',reqs:'ใบเบิก-ใบส่งคืน',inner:'ใบเบิกภายใน',repairs:'ประวัติซ่อม',condLogs:'ปรับสภาพ',counts:'ตรวจนับ'};
const GCOLS={
  items:[['ชื่อวัสดุ',r=>r.name],['ประเภท',r=>r.kind],['หมวด',r=>r.group],['หน่วยนับ',r=>r.unit],['จุดเบิกเพิ่ม',r=>r.min],['ที่เก็บ',r=>r.place]],
  assets:[['หมายเลขพัสดุ',r=>r.code],['ชื่อครุภัณฑ์',r=>r.name],['ยี่ห้อ/รุ่น',r=>r.brand],['เลขประจำเครื่อง',r=>r.serial],['ราคา',r=>r.price],['วันที่ได้รับ',r=>r.recvDate]],
  reqs:[['ทะเบียน',r=>r.reg],['เอกสาร',r=>(r.kind==='ret'?'ใบส่งคืน':r.kind==='open'?'ยอดยกมา':'ใบเบิก')+(r.cls==='A'?'ครุภัณฑ์':'วัสดุ')],['วันที่',r=>r.date],['วันที่ได้รับ',r=>r.recvDate],['ทะเบียนหน่วยจ่าย',r=>r.centralNo],['รายการ',r=>reqLinesBrief(r).replace(/<[^>]+>/g,'')],['เพื่อใช้ในงาน / เหตุผล',r=>r.purpose]],
  inner:[['เล่ม/เลขที่',r=>r.kind==='issue'?r.book+'/'+r.no:'รับคืน'],['วันที่',r=>r.date],['จ่ายให้ / รับคืนจาก',r=>r.to],['ผู้เบิก',r=>r.person],['รายการ',r=>r.lines.map(l=>l.aid?(assetOf(l.aid)?.code||''):(itemOf(l.iid)?.name||'')+' × '+l.qty).join(', ')]],
  repairs:[['วันที่',r=>r.date],['หมายเลขพัสดุ',r=>assetOf(r.aid)?.code],['รายการซ่อม',r=>r.detail],['ค่าใช้จ่าย',r=>r.amount],['ร้าน / ผู้ซ่อม',r=>r.vendor]],
  condLogs:[['วันที่',r=>r.date],['หมายเลขพัสดุ',r=>assetOf(r.aid)?.code],['สภาพ',r=>r.cond],['รายละเอียด',r=>r.note]],
  counts:[['ปีงบประมาณ',r=>r.fy],['วันที่ตรวจนับ',r=>r.date]]};
let gas={ver:0,snap:{},url:'',user:'',busy:false,again:false,timer:null,state:'ready',err:''};
const gasRun=(fn,...a)=>GAS_UI?new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a)):apiCall(fn,a,api);
async function apiCall(fn,args,conn){let r;try{r=await fetch(conn.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args,key:conn.key}),redirect:'follow'})}
  catch(e){throw new Error('ติดต่อ Apps Script ไม่ได้ ตรวจ URL และการตั้งค่า "ผู้ที่มีสิทธิ์เข้าถึง: ทุกคน"')}
  if(!r.ok)throw new Error('Apps Script ตอบกลับ HTTP '+r.status);let j;try{j=await r.json()}catch(e){throw new Error('Apps Script ไม่ได้ตอบเป็นข้อมูลระบบ ตรวจว่าวาง Code.gs ฉบับใหม่และ Deploy แล้ว')}
  if(j.error)throw new Error(j.error);return j.ok}
/* หน้าเลือก / เพิ่มฐานข้อมูล */
function apiSetup(msg){$('#nav').innerHTML=`<div class="brand"><div class="seal">บ</div><div><b>พัสดุหน่วยเบิก</b><small>เลือกฐานข้อมูล</small></div></div>`;
  const L=conns.list;
  $('#main').innerHTML=`<div style="max-width:720px;margin:24px auto;display:grid;gap:14px">
   <div><h1>เลือกฐานข้อมูลหน่วยเบิก</h1><div class="sub">หัวหน้าหน่วยเบิกแต่ละคนมี Google Sheet และรหัสผ่านของตัวเอง เพิ่มไว้ได้หลายฐาน แล้วเลือกเปิดฐานที่ต้องการ</div></div>
   ${msg?`<div class="panel" style="color:var(--bad);border-color:var(--bad)">${esc(msg)}</div>`:''}
   ${L.length?`<div class="panel"><h2>ฐานข้อมูลที่บันทึกไว้ (${L.length})</h2><div class="pick" style="max-height:none">${L.map(c=>`<label style="cursor:pointer"><input type="radio" style="width:auto;flex:none" name="connPick" value="${c.id}" id="cp_${c.id}" ${c.id===conns.current||(!conns.current&&c===L[0])?'checked':''}><span style="flex:1;min-width:0"><b>${esc(c.name||'(ยังไม่มีชื่อ)')}</b><br><span class="sub code" style="font-size:11px">${esc(c.url.replace(/^https:\/\/script\.google\.com\/macros\/s\//,'…/').slice(0,60))}</span></span><button type="button" class="btn sm" data-act="conn-edit" data-id="${c.id}" id="ce_${c.id}">แก้ไข</button><button type="button" class="btn sm danger" data-act="conn-del" data-id="${c.id}" id="cx_${c.id}">ลบ</button></label>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-top:10px"><label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" id="connAuto" ${conns.auto?'checked':''}> เปิดฐานที่เลือกอัตโนมัติเมื่อเข้าเว็บครั้งต่อไป</label><button class="btn pri" data-act="conn-open" id="connOpen">เปิดฐานข้อมูลนี้</button></div></div>`:''}
   <form class="panel" id="apiForm"><h2 id="apiFormTitle">${L.length?'เพิ่มฐานข้อมูล':'เชื่อมต่อฐานข้อมูลแรก'}</h2><input type="hidden" name="id" id="f_cid" value="">
    <div class="fg">${F('name','ชื่อเรียก (ว่างไว้จะใช้ชื่อหน่วยเบิกจากฐาน)','','w6','text','placeholder="เช่น แผนกวิชาช่างยนต์ - หัวหน้าแผนก"')}
    ${F('url','URL เว็บแอป Apps Script (ลงท้ายด้วย /exec)','','w6','url','required list="urlList" placeholder="https://script.google.com/macros/s/.../exec"')}${F('key','รหัสผ่านของหน่วย (ตั้งที่ Google Sheet > เมนู ระบบพัสดุ)','','w6','password','required autocomplete="off"')}</div>
    <datalist id="urlList">${[...new Set(L.map(c=>c.url))].map(u=>`<option value="${esc(u)}">`).join('')}</datalist>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button type="button" class="btn" data-act="conn-new" id="connNew" ${L.length?'':'hidden'}>ล้างช่อง</button><button class="btn pri" id="apiOk">ตรวจสอบและบันทึก</button></div></form></div>`;
  $('#connAuto')?.addEventListener('change',e=>{conns.auto=e.target.checked;connSave()});
  $('#apiForm').addEventListener('submit',async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const conn={url:o.url.trim(),key:o.key};const b=$('#apiOk');b.disabled=true;b.textContent='กำลังตรวจสอบ...';
    try{await apiCall('getVersion',[],conn);const id=o.id||('c'+Date.now().toString(36));const ex=conns.list.find(c=>c.id===id);
      if(ex)Object.assign(ex,{name:o.name.trim(),url:conn.url,key:conn.key});else conns.list.push({id,name:o.name.trim(),url:conn.url,key:conn.key});
      conns.current=id;connSave();connOpen(id)}
    catch(err){b.disabled=false;b.textContent='ตรวจสอบและบันทึก';toast(err.message,true)}})}
function connOpen(id){const c=conns.list.find(x=>x.id===id);if(!c){apiSetup();return}conns.current=id;connSave();api={url:c.url,key:c.key};gasBoot()}
async function connSwitch(){if(gas.timer||gas.busy||gas.state!=='ready'){clearTimeout(gas.timer);gas.timer=null;await gasFlush();let n=0;while(gas.busy&&n++<40)await new Promise(r=>setTimeout(r,250))}
  if(gas.state==='error'){toast('ยังบันทึกข้อมูลล่าสุดไม่สำเร็จ ลองอีกครั้งก่อนสลับฐาน',true);return}closeOverlays();apiSetup()}
const gasMeta=()=>({settings:db.settings,rooms:db.rooms,counters:db.counters,sample:db.sample,app:'pasadu-unit',version:1});
function gasSnapAll(){gas.snap={};for(const k in GTITLE)gas.snap[k]=JSON.stringify(db[k]);gas.snap.meta=JSON.stringify(gasMeta())}
function gasPayload(){const sheets={},sent={};
  for(const k in GTITLE){const j=JSON.stringify(db[k]);if(gas.snap[k]===j)continue;sent[k]=j;
    sheets[k]={header:['รหัสระบบ',...GCOLS[k].map(c=>c[0]),'ข้อมูล (ห้ามแก้)'],rows:db[k].map(r=>[r.id||('fy'+r.fy),...GCOLS[k].map(c=>{try{const v=c[1](r);return v==null?'':v}catch(e){return ''}}),JSON.stringify(r)])}}
  const mj=JSON.stringify(gasMeta());let meta=null,metaRows=null;
  if(gas.snap.meta!==mj){sent.meta=mj;meta=gasMeta();const s=db.settings;
    metaRows=[['ชื่อหน่วยเบิก',s.unit],['สถานศึกษา',s.org],['หน่วยจ่าย',s.central],['หัวหน้าหน่วยเบิก',s.headName],['ตำแหน่ง',s.headPos],['เจ้าหน้าที่พัสดุของหน่วยเบิก',s.officerName],['ตำแหน่ง',s.officerPos],['ห้อง / งาน / ผู้ใช้',db.rooms.join(', ')]]}
  return{payload:{baseVersion:gas.ver,sheets,meta,metaRows},sent}}
function gasQueue(){clearTimeout(gas.timer);gas.state='pending';renderNav();gas.timer=setTimeout(gasFlush,500)}
async function gasFlush(){if(gas.busy){gas.again=true;return}const{payload,sent}=gasPayload();if(!Object.keys(sent).length){gas.state='ready';renderNav();return}
  gas.busy=true;gas.state='saving';renderNav();
  try{const res=await gasRun('saveData',payload);
    if(res.conflict){db=Object.assign(blank(),res.db||{});gas.ver=res.version;gasSnapAll();gas.state='ready';closeOverlays();render();
      toast('มีผู้อื่นบันทึกข้อมูลก่อนหน้า ระบบโหลดข้อมูลล่าสุดแล้ว รายการล่าสุดของคุณยังไม่ถูกบันทึก กรุณาทำอีกครั้ง',true)}
    else{gas.ver=res.version;Object.assign(gas.snap,sent);gas.state='ready'}}
  catch(e){gas.state='error';gas.err=String(e&&e.message||e);toast('บันทึกลง Google Sheet ไม่สำเร็จ: '+gas.err+' ระบบจะลองใหม่',true);setTimeout(gasFlush,8000)}
  finally{gas.busy=false;renderNav();if(gas.again){gas.again=false;gasFlush()}}}
function closeOverlays(){try{dlg.close()}catch(e){}$('#pv').hidden=true}
function gasBadge(){if(API_MODE&&db){const c=connCur();if(c&&!c.name&&db.settings.unit){c.name=db.settings.unit;connSave()}}const t={ready:'● บันทึกใน Google Sheet แล้ว',pending:'○ รอบันทึก...',saving:'○ กำลังบันทึก...',error:'● บันทึกไม่สำเร็จ กำลังลองใหม่'}[gas.state];return `<span class="filebadge" style="${gas.state==='error'?'background:#b42318':''}">${t}</span>`+(API_MODE?`<div style="padding:10px 8px 0"><div class="sub" style="color:#c9d4e3;font-size:12px">ฐานข้อมูล: ${esc(connCur()?.name||unitName())}${conns.list.length>1?` (${conns.list.length} ฐาน)`:''}</div><button class="btn sm" data-act="conn-switch" id="connSwitch" style="margin-top:6px">สลับ / เพิ่มฐานข้อมูล</button></div>`:'')}
async function gasBoot(){$('#nav').innerHTML='';$('#main').innerHTML='<div class="panel empty" style="margin-top:40px">กำลังโหลดข้อมูลจาก Google Sheet...</div>';
  try{const res=await gasRun('getData');db=res.db?Object.assign(blank(),res.db):blank();gas.ver=res.version;gas.url=res.url;gas.user=res.user;gasSnapAll();if(API_MODE){const c=connCur();if(c&&!c.name&&db.settings.unit){c.name=db.settings.unit;connSave()}}
    if(!res.db){gas.snap={};gasQueue()}/* ชีตใหม่: สร้างแผ่นงานทั้งหมด */
    render();if(!db.settings.unit&&!db.sample)location.hash='#settings'}
  catch(e){if(API_MODE){apiSetup('เปิดข้อมูลไม่ได้: '+(e&&e.message||e));return}$('#main').innerHTML=`<div class="panel empty" style="margin-top:40px">เปิดข้อมูลจาก Google Sheet ไม่ได้: ${esc(e&&e.message||e)}<br>ตรวจสิทธิ์การเข้าถึงสคริปต์ แล้วโหลดหน้าใหม่</div>`}}
/* ดึงข้อมูลล่าสุดเมื่อคนอื่นแก้ (ตรวจทุก 45 วินาที และเมื่อกลับมาที่หน้านี้) */
async function gasRefresh(){if(!GAS||gas.busy||gas.state!=='ready'||dlg.open)return;
  try{const v=await gasRun('getVersion');if(v===gas.ver)return;const res=await gasRun('getData');if(gas.state!=='ready'||dlg.open)return;
    db=res.db?Object.assign(blank(),res.db):blank();gas.ver=res.version;gasSnapAll();if($('#pv').hidden)render();toast('อัปเดตข้อมูลล่าสุดจาก Google Sheet แล้ว')}catch(e){}}
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
function showLink(url,label){const a=$('#pvLink');a.href=url;a.textContent=label;a.hidden=false}
const TH2AR=s=>String(s).replace(/[๐-๙]/g,c=>'๐๑๒๓๔๕๖๗๘๙'.indexOf(c));
function tableToArrays(t){const out=[];for(const tr of t.rows){const row=[];for(const td of tr.cells){let v=td.innerText.replace(/\s+\n/g,'\n').trim();const n=TH2AR(v).replace(/,/g,'');if(/^-?\d+(\.\d+)?$/.test(n)&&!/^0\d/.test(n))v=Number(n);row.push(v);for(let i=1;i<(td.colSpan||1);i++)row.push('')}out.push(row)}return out}
if(GAS){ACT['api-reset']=()=>connSwitch();ACT['conn-switch']=()=>connSwitch();
  ACT['conn-open']=()=>{const r=document.querySelector('input[name=connPick]:checked');if(r)connOpen(r.value)};
  ACT['conn-del']=el=>confirm2(el,()=>{conns.list=conns.list.filter(c=>c.id!==el.dataset.id);if(conns.current===el.dataset.id)conns.current='';connSave();apiSetup()});
  ACT['conn-edit']=el=>{const c=conns.list.find(x=>x.id===el.dataset.id);$('#f_cid').value=c.id;$('#f_name').value=c.name;$('#f_url').value=c.url;$('#f_key').value=c.key;$('#apiFormTitle').textContent='แก้ไข: '+(c.name||'ฐานข้อมูล');$('#connNew').hidden=false;$('#f_name').focus()};
  ACT['conn-new']=()=>{['#f_cid','#f_name','#f_url','#f_key'].forEach(x=>$(x).value='');$('#apiFormTitle').textContent='เพิ่มฐานข้อมูล'};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)gasRefresh()});setInterval(gasRefresh,45000)}
if(GAS_UI){
  ACT['pv-pdf']=async el=>{if(!pvPdf)return;el.disabled=true;el.textContent='กำลังบันทึกลง Drive...';
    try{if(!pvPdf.blob)pvPdf.blob=await sheetsToPdf();const r=await gasRun('saveFile',pvPdf.name,await blobToB64(pvPdf.blob),'application/pdf');showLink(r.url,'เปิด PDF ใน Drive');toast('บันทึก '+r.name+' ลง Google Drive แล้ว')}
    catch(e){toast('บันทึก PDF ไม่สำเร็จ: '+(e.message||e),true)}finally{el.disabled=false;el.textContent='บันทึก PDF ลง Drive'}};
  ACT['pv-xls']=async el=>{el.disabled=true;el.textContent='กำลังสร้าง Google Sheet...';
    try{let tables;if(pvXlsFn){const box=document.createElement('div');box.innerHTML=pvXlsFn(true);tables=[...box.querySelectorAll('table')]}else tables=[...document.querySelectorAll('#paper table')];
      const holder=document.createElement('div');holder.style.cssText='position:absolute;left:-9999px;top:0';tables.forEach(t=>holder.appendChild(t.cloneNode(true)));document.body.appendChild(holder);
      const arr=[...holder.querySelectorAll('table')].map(tableToArrays);holder.remove();
      const r=await gasRun('makeSheet',($('#pvTitle').textContent||'รายงาน')+' - '+unitName(),arr);showLink(r.url,'เปิดใน Google Sheets');toast('สร้าง Google Sheet "'+r.name+'" แล้ว')}
    catch(e){toast('สร้าง Google Sheet ไม่สำเร็จ: '+(e.message||e),true)}finally{el.disabled=false;el.textContent='เปิดเป็น Google Sheet'}};
  ACT['backup']=async el=>{const d=new Date();try{const r=await gasRun('saveFile',`สำรองพัสดุ_${(db.settings.unit||'หน่วยเบิก')}_${d.getFullYear()+543}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}.json`,await blobToB64(new Blob([JSON.stringify(db)],{type:'application/json'})),'application/json');toast('บันทึกไฟล์สำรองลงโฟลเดอร์ "พัสดุหน่วยเบิก - เอกสาร" แล้ว')}catch(e){toast('สำรองไม่สำเร็จ: '+(e.message||e),true)}};
}
/* เริ่มระบบ */
if(GAS_UI){$('#pvPdf').textContent='บันทึก PDF ลง Drive';$('#pvXls').textContent='เปิดเป็น Google Sheet';gasBoot()}else if(API_MODE){const c=connCur();c&&conns.auto?connOpen(c.id):apiSetup()}else standaloneBoot();
</script>
</body>
